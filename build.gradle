plugins {
    // 26.x is unobfuscated: non-remapping Loom, no mappings, no mod* dependency configurations.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom already provides Fabric, Mojang and Maven Central. Add repositories here only for
    // extra mod dependencies.
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    // Rendering/screen/keybinding code lives in src/client and cannot leak into the server jar.
    splitEnvironmentSourceSets()

    mods {
        "herobrine" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu is client-only and optional: the entrypoint is only looked up when it is installed.
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

// Catch missing or malformed entity skins before publishing a jar. The renderer expects 64x64
// player-layout textures for every form, including the separate glowing-eye layers.
tasks.register('verifyEntityTextures') {
    def textures = ['herobrine', 'herobrine_eyes', 'herobrine_hostile', 'herobrine_hostile_eyes',
                    'herobrine_elite', 'herobrine_elite_eyes', 'herobrine_inferno',
                    'herobrine_inferno_eyes', 'steve_friend']
    def textureDir = layout.projectDirectory.dir('src/main/resources/assets/herobrine/textures/entity')
    inputs.files(textures.collect { textureDir.file("${it}.png") })
    doLast {
        textures.each { name ->
            def file = textureDir.file("${name}.png").asFile
            if (!file.isFile()) {
                throw new GradleException("Missing entity texture: ${file}")
            }
            def image = javax.imageio.ImageIO.read(file)
            if (image == null || image.width != 64 || image.height != 64) {
                throw new GradleException("Invalid entity texture (expected 64x64 PNG): ${file}")
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyEntityTextures') }

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
