plugins {
    // 26.x is unobfuscated: non-remapping Loom, no mappings, no mod* dependency configurations.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom already provides Fabric, Mojang and Maven Central. Add repositories here only for
    // extra mod dependencies.
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    // Rendering/screen/keybinding code lives in src/client and cannot leak into the server jar.
    splitEnvironmentSourceSets()

    mods {
        "herobrine" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu is client-only and optional: the entrypoint is only looked up when it is installed.
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

// Catch missing or malformed entity skins before publishing a jar. Bodies use the 64x64 player
// layout; eye masks use the same UV layout at 256x256 to provide a softer right-eye halo.
tasks.register('verifyEntityTextures') {
    def textures = ['herobrine', 'herobrine_eyes', 'herobrine_hostile', 'herobrine_hostile_eyes',
                    'herobrine_elite', 'herobrine_elite_eyes', 'herobrine_inferno',
                    'herobrine_inferno_eyes', 'steve_friend']
    def textureDir = layout.projectDirectory.dir('src/main/resources/assets/herobrine/textures/entity')
    inputs.files(textures.collect { textureDir.file("${it}.png") })
    doLast {
        textures.each { name ->
            def file = textureDir.file("${name}.png").asFile
            if (!file.isFile()) {
                throw new GradleException("Missing entity texture: ${file}")
            }
            def image = javax.imageio.ImageIO.read(file)
            def size = name.endsWith('_eyes') ? 256 : 64
            if (image == null || image.width != size || image.height != size) {
                throw new GradleException("Invalid entity texture (expected ${size}x${size} PNG): ${file}")
            }
            if (name.endsWith('_eyes')) {
                // The character's right eye appears on the viewer's left. The opposite eye must
                // have no emissive pixels, and the halo must remain on the front face of the head.
                for (int y = 0; y < size; y++) {
                    for (int x = 0; x < size; x++) {
                        if (((image.getRGB(x, y) >>> 24) & 0xff) != 0 &&
                            (x < 32 || x > 47 || y < 32 || y > 63)) {
                            throw new GradleException("Eye glow outside right-eye region: ${file}")
                        }
                    }
                }
                if (((image.getRGB(38, 50) >>> 24) & 0xff) != 255 ||
                    ((image.getRGB(35, 50) >>> 24) & 0xff) == 0) {
                    throw new GradleException("Missing right-eye core or halo: ${file}")
                }
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyEntityTextures') }

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
