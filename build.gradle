plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "herobrine" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.register('verifyEntityTextures') {
    def textures = ['herobrine', 'herobrine_eyes', 'herobrine_hostile', 'herobrine_hostile_eyes',
                    'herobrine_elite', 'herobrine_elite_eyes', 'steve_friend', 'alex_friend']
    def textureDir = layout.projectDirectory.dir('src/main/resources/assets/herobrine/textures/entity')
    inputs.files(textures.collect { textureDir.file("${it}.png") })
    doLast {
        textures.each { name ->
            def file = textureDir.file("${name}.png").asFile
            if (!file.isFile()) {
                throw new GradleException("Missing entity texture: ${file}")
            }
            def image = javax.imageio.ImageIO.read(file)
            def size = name.endsWith('_eyes') ? 256 : 64
            if (image == null || image.width != size || image.height != size) {
                throw new GradleException("Invalid entity texture (expected ${size}x${size} PNG): ${file}")
            }
            if (name.endsWith('_eyes')) {
                for (int y = 0; y < size; y++) {
                    for (int x = 0; x < size; x++) {
                        if (((image.getRGB(x, y) >>> 24) & 0xff) != 0 &&
                            (x < 32 || x > 63 || y < 32 || y > 63)) {
                            throw new GradleException("Eye glow outside the head's front face: ${file}")
                        }
                    }
                }

                for (int y = 0; y < size; y++) {
                    for (int x = 32; x <= 63; x++) {
                        if (((image.getRGB(x, y) >>> 24) & 0xff) !=
                            ((image.getRGB(95 - x, y) >>> 24) & 0xff)) {
                            throw new GradleException("Eye mask not mirrored at x=${x}, y=${y}: ${file}")
                        }
                    }
                }

                if (((image.getRGB(38, 50) >>> 24) & 0xff) != 255 ||
                    ((image.getRGB(57, 50) >>> 24) & 0xff) != 255) {
                    throw new GradleException("Missing an opaque eye core: ${file}")
                }

                if (((image.getRGB(35, 50) >>> 24) & 0xff) == 0 ||
                    ((image.getRGB(60, 50) >>> 24) & 0xff) == 0) {
                    throw new GradleException("Missing an eye halo: ${file}")
                }

                for (int y = 32; y < size; y++) {
                    if (y >= 40 && y <= 59) {
                        continue
                    }

                    for (int x = 32; x <= 63; x++) {
                        if (((image.getRGB(x, y) >>> 24) & 0xff) != 0) {
                            throw new GradleException("Eye glow outside the eye band at y=${y}: ${file}")
                        }
                    }
                }
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyEntityTextures') }

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
