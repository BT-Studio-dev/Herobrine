# Toolchain for the Minecraft 1.21.11 build. These live here rather than in the root
# gradle.properties because Gradle only reads the properties file next to the settings file,
# and this project is a separate one.
#
# 1.21.11 is obfuscated, so it needs the remapping Loom (unlike 26.3, which ships unobfuscated
# and needs the non-remapping one), an older loader, and Mod Menu 16.
legacy_minecraft_version=1.21.11
legacy_loader_version=0.16.14
legacy_loom_version=1.13-SNAPSHOT
legacy_fabric_api_version=0.141.3+1.21.11
legacy_modmenu_version=16.0.0-rc.1
