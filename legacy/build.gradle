// A second build of the same mod for Minecraft 1.21.11, from the sources in ../src.
//
// It has to be a project of its own rather than a flag in build.gradle, for two reasons: Gradle 9
// removed -b/--build-file, and the two versions need different Loom plugins anyway. 26.x ships
// unobfuscated and uses the non-remapping Loom with plain `implementation` dependencies, while
// 1.21.11 is obfuscated and needs the remapping Loom with `modImplementation` and a mappings set.
// The plugin id is fixed in the plugins block, so it cannot be switched at the command line.
//
// Build it from the repository root with:
//
//     cd legacy && ../gradlew build
//
// The jar lands in legacy/build/libs/ as herobrine-<version>+1.21.11.jar, which cannot collide
// with the 26.3 jar in build/libs/.

plugins {
    id 'fabric-loom' version "${legacy_loom_version}"
}

// mod_version, maven_group and archives_base_name come from the repository root's
// gradle.properties, loaded in settings.gradle, so a version bump only has to happen once.
def shared = gradle.ext.shared

version = shared['mod_version'] + "+1.21.11"
group = shared['maven_group']

base {
    archivesName = shared['archives_base_name']
}

// This project has no sources of its own; everything lives one directory up.
sourceSets {
    main {
        java.srcDirs = ['../src/main/java']
        resources.srcDirs = ['../src/main/resources']
    }
    client {
        java.srcDirs = ['../src/client/java']
        resources.srcDirs = [] // src/client/resources does not exist in this project
    }
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "herobrine" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${legacy_minecraft_version}"

    // Mojang's official mappings, so the sources read the same here as they do on unobfuscated
    // 26.x. This is the fix for the failure on the earlier attempt: that one pulled in Yarn, which
    // calls the package net.minecraft.sound where Mojang calls it net.minecraft.sounds, and
    // ModSounds.java stopped compiling.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${legacy_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${legacy_fabric_api_version}"

    clientCompileOnly "com.terraformersmc:modmenu:${legacy_modmenu_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }

    // Same sources, different game, so the dependency block has to be rewritten after the fact.
    // Kept here rather than templated into fabric.mod.json so the 26.3 build is left untouched.
    doLast {
        def modJson = layout.buildDirectory.file("resources/main/fabric.mod.json").get().asFile
        def replacements = [
            '"fabricloader": ">=0.19.0"': '"fabricloader": ">=0.16.0"',
            '"minecraft": "~26.3"'       : '"minecraft": "~1.21.11"',
            '"java": ">=25"'             : '"java": ">=21"',
            '"fabric-api": ">=0.165.0"'  : '"fabric-api": "*"',
            '"modmenu": ">=21.0.0"'      : '"modmenu": ">=16.0.0"',
            'on Minecraft 26.3'          : 'on Minecraft 1.21.11',
        ]

        def text = modJson.text
        def original = text
        replacements.each { from, to -> text = text.replace(from, to) }

        if (text == original) {
            throw new GradleException(
                "No dependency replacements applied to fabric.mod.json. The file has changed; " +
                "update the replacements in legacy/build.gradle.")
        }

        replacements.each { from, to ->
            if (original.contains(from) && !text.contains(to)) {
                throw new GradleException("Dependency replacement failed for: ${from}")
            }
        }

        modJson.text = text
    }
}

// 1.21.11 runs on Java 21, where 26.3 needs Java 25.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
