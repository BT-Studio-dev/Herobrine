// The 1.21.11 build is a project in its own right, because Gradle 9 removed the -b/--build-file
// option and there is no other way to point a single project at two different build scripts.
// It has no sources of its own: legacy/build.gradle reaches back up to ../src.

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'herobrine-legacy'

// Gradle only reads the gradle.properties next to the settings file, so the mod version, group and
// archive name would otherwise have to be written twice and would drift apart. Load the root's
// file by hand and hand the values to the build script.
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
gradle.ext.shared = shared
