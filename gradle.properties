org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric - Minecraft 26.3
# 26.x ships unobfuscated, so there are no mappings and the non-remapping Loom plugin is used.
# Check these numbers on https://fabricmc.net/develop before bumping.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.2+26.3

# The 1.21.11 build (build-12111.gradle). A second set of numbers, because 1.21.11 is obfuscated
# and needs the remapping Loom, an older loader and Mod Menu 16. The 26.3 build above is the
# primary one and these are only read by build-12111.gradle.
legacy_minecraft_version=1.21.11
legacy_loader_version=0.16.14
legacy_loom_version=1.13-SNAPSHOT
legacy_fabric_api_version=0.141.3+1.21.11
legacy_modmenu_version=16.0.0-rc.1

# Mod
mod_version=3.0.4
maven_group=dev.btstudio
archives_base_name=herobrine
modmenu_version=21.0.0
